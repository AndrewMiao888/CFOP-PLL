<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLL Sheet Canvas Editor</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --panel-bg: #2d2d2d;
            --accent: #4CAF50;
            --accent-hover: #45a049;
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --border: #444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Control Panel (Mini-Canva style) */
        sidebar {
            width: 350px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 4px 0 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-dark);
        }

        .sidebar-header h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }

        .sidebar-content {
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-group {
            background: var(--bg-dark);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .section-group h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 12px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #121212;
            border: 1px solid var(--border);
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
        .btn-secondary { background-color: #444; margin-top: 5px; }
        .btn-secondary:hover { background-color: #555; }

        /* Thumbnails Manager */
        .thumb-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .thumb-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #121212;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .thumb-item.active {
            border-color: var(--accent);
        }

        .thumb-item img {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 2px;
        }

        .thumb-item span {
            font-size: 12px;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Preview Canvas Area */
        main {
            flex-grow: 1;
            background: #181818;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: auto;
        }

        canvas {
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-height: 90vh;
            width: auto;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR EDITOR (Mini-Canva UI) -->
    <sidebar>
        <div class="sidebar-header">
            <h2>PLL Sheet Studio</h2>
            <input type="file" id="imageUpload" multiple accept="image/*">
        </div>

        <div class="sidebar-content">
            <!-- Sheet Settings -->
            <div class="section-group">
                <h3>Sheet Settings</h3>
                <label>Sheet Title</label>
                <input type="text" id="sheetTitle" value="PLL Algorithms Cheat Sheet">
            </div>

            <!-- Uploaded Cases Manager -->
            <div class="section-group">
                <h3>Cases Manager (<span id="caseCount">0</span>)</h3>
                <div class="thumb-list" id="thumbList">
                    <div style="font-size: 12px; color: #777; text-align: center; padding: 10px;">No images uploaded yet.</div>
                </div>
            </div>

            <!-- Crop & Layout Adjuster -->
            <div class="section-group">
                <h3>Crop Fine-Tuning</h3>
                
                <label>Case Crop X: <span id="val-caseX">4</span>%</label>
                <input type="range" id="caseX" min="0" max="40" value="4">

                <label>Case Crop Y: <span id="val-caseY">74</span>%</label>
                <input type="range" id="caseY" min="50" max="90" value="74">

                <label>Case Crop Size: <span id="val-caseSize">15</span>%</label>
                <input type="range" id="caseSize" min="5" max="30" value="15">

                <hr style="border-color: var(--border); margin: 10px 0;">

                <label>Alg Crop Height: <span id="val-algH">22</span>%</label>
                <input type="range" id="algH" min="10" max="40" value="22">

                <button class="btn btn-secondary" id="applyToAllBtn">Apply Settings to All Cases</button>
            </div>

            <!-- Download Action -->
            <button class="btn" id="downloadBtn" disabled>Download A4 Sheet</button>
        </div>
    </sidebar>

    <!-- PREVIEW AREA -->
    <main>
        <canvas id="sheetCanvas" width="1240" height="1754"></canvas>
    </main>

    <script>
        const canvas = document.getElementById('sheetCanvas');
        const ctx = canvas.getContext('2d');
        const imageUpload = document.getElementById('imageUpload');
        const downloadBtn = document.getElementById('downloadBtn');
        const sheetTitleInput = document.getElementById('sheetTitle');
        const thumbList = document.getElementById('thumbList');
        const caseCountDisplay = document.getElementById('caseCount');
        const applyToAllBtn = document.getElementById('applyToAllBtn');

        // UI Sliders
        const sliderCaseX = document.getElementById('caseX');
        const sliderCaseY = document.getElementById('caseY');
        const sliderCaseSize = document.getElementById('caseSize');
        const sliderAlgH = document.getElementById('algH');

        let casesData = []; // Array storing image objects and individual crop parameters
        let selectedIndex = null; // Currently selected image for fine-tuning

        // Update slider percentage text labels live
        function updateSliderLabels() {
            document.getElementById('val-caseX').innerText = sliderCaseX.value;
            document.getElementById('val-caseY').innerText = sliderCaseY.value;
            document.getElementById('val-caseSize').innerText = sliderCaseSize.value;
            document.getElementById('val-algH').innerText = sliderAlgH.value;
        }

        // Handle file uploads
        imageUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            let loadedFiles = 0;
            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        casesData.push({
                            img: img,
                            name: file.name,
                            enabled: true,
                            // Default precise crop ratios
                            caseX: 0.04,
                            caseY: 0.74,
                            caseSize: 0.15,
                            algH: 0.22
                        });
                        loadedFiles++;
                        if (loadedFiles === files.length) {
                            if (selectedIndex === null) selectedIndex = 0;
                            updateThumbnails();
                            loadSettingsToSliders(selectedIndex);
                            drawSheet();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
            imageUpload.value = ''; // Reset input
        });

        // Update thumbnail sidebar list
        function updateThumbnails() {
            thumbList.innerHTML = '';
            caseCountDisplay.innerText = casesData.length;

            if (casesData.length === 0) {
                thumbList.innerHTML = '<div style="font-size: 12px; color: #777; text-align: center; padding: 10px;">No images uploaded yet.</div>';
                return;
            }

            casesData.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `thumb-item ${idx === selectedIndex ? 'active' : ''}`;
                
                // Create mini preview canvas for thumbnail
                const thumbCanvas = document.createElement('canvas');
                thumbCanvas.width = 30;
                thumbCanvas.height = 30;
                const tCtx = thumbCanvas.getContext('2d');
                tCtx.drawImage(item.img, 0, 0, thumbCanvas.width, thumbCanvas.height);

                div.innerHTML = `
                    <input type="checkbox" ${item.enabled ? 'checked' : ''} data-index="${idx}" class="toggle-case">
                    <img src="${thumbCanvas.toDataURL()}">
                    <span>${item.name}</span>
                `;

                // Click thumbnail to select for editing
                div.addEventListener('click', (e) => {
                    if (e.target.tagName === 'INPUT') return; // Don't trigger selection when clicking checkbox
                    selectedIndex = idx;
                    updateThumbnails();
                    loadSettingsToSliders(selectedIndex);
                });

                // Toggle visibility checkbox
                div.querySelector('.toggle-case').addEventListener('change', (e) => {
                    casesData[idx].enabled = e.target.checked;
                    drawSheet();
                });

                thumbList.appendChild(div);
            });
        }

        // Load specific case settings into sidebar controls
        function loadSettingsToSliders(idx) {
            if (casesData[idx]) {
                const c = casesData[idx];
                sliderCaseX.value = Math.round(c.caseX * 100);
                sliderCaseY.value = Math.round(c.caseY * 100);
                sliderCaseSize.value = Math.round(c.caseSize * 100);
                sliderAlgH.value = Math.round(c.algH * 100);
                updateSliderLabels();
            }
        }

        // Save slider values to currently selected item
        function updateCurrentCaseFromSliders() {
            if (selectedIndex !== null && casesData[selectedIndex]) {
                casesData[selectedIndex].caseX = sliderCaseX.value / 100;
                casesData[selectedIndex].caseY = sliderCaseY.value / 100;
                casesData[selectedIndex].caseSize = sliderCaseSize.value / 100;
                casesData[selectedIndex].algH = sliderAlgH.value / 100;
                updateSliderLabels();
                drawSheet();
            }
        }

        // Event listeners for sliders
        [sliderCaseX, sliderCaseY, sliderCaseSize, sliderAlgH].forEach(slider => {
            slider.addEventListener('input', () => {
                updateSliderLabels();
                updateCurrentCaseFromSliders();
            });
        });

        // Apply settings to all cases
        applyToAllBtn.addEventListener('click', () => {
            if (selectedIndex === null || casesData.length === 0) return;
            const template = casesData[selectedIndex];
            casesData.forEach(item => {
                item.caseX = template.caseX;
                item.caseY = template.caseY;
                item.caseSize = template.caseSize;
                item.algH = template.algH;
            });
            drawSheet();
            alert('Settings applied to all cases!');
        });

        sheetTitleInput.addEventListener('input', drawSheet);

        // Master Render Function for A4 Canvas
        function drawSheet() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Title
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(sheetTitleInput.value || 'PLL Sheet', canvas.width / 2, 90);

            // Header Underline
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(80, 125);
            ctx.lineTo(canvas.width - 80, 125);
            ctx.stroke();

            const activeCases = casesData.filter(c => c.enabled);

            if (activeCases.length === 0) {
                ctx.fillStyle = '#777777';
                ctx.font = 'italic 30px Arial';
                ctx.fillText('Upload screenshots and enable them to build your A4 sheet.', canvas.width / 2, 300);
                downloadBtn.disabled = true;
                return;
            }

            let marginX = 80;
            let usableWidth = canvas.width - (marginX * 2); // 1080px
            let colWidth = usableWidth / 2; // 540px per column
            let rowHeight = 115; 
            let startY = 170;

            activeCases.forEach((item, index) => {
                let colIndex = index % 2; 
                let rowIndex = Math.floor(index / 2);

                let currentX = marginX + (colIndex * colWidth);
                let currentY = startY + (rowIndex * rowHeight);

                // Auto-expand canvas height if needed
                if (currentY + rowHeight > canvas.height - 80) {
                    let oldData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    canvas.height += 500;
                    ctx.putImageData(oldData, 0, 0);
                }

                const img = item.img;

                // 1. EXTRACT BOTTOM-LEFT CASE (Strict 1:1 Square Ratio)
                let cropSize = img.width * item.caseSize;
                let cropX = img.width * item.caseX;
                let cropY = img.height * item.caseY;
                let displaySize = 80; // Rendered square box size

                ctx.drawImage(img, cropX, cropY, cropSize, cropSize, currentX, currentY, displaySize, displaySize);
                
                // Crisp border around case box
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 2;
                ctx.strokeRect(currentX, currentY, displaySize, displaySize);

                // 2. EXTRACT TOP ALGORITHM (Full width preserved)
                let algX = 0;
                let algY = 0;
                let algW = img.width;
                let algH = img.height * item.algH;

                let algDestX = currentX + displaySize + 15;
                let algDestW = colWidth - displaySize - 30;
                let algDestH = 50;

                ctx.drawImage(img, algX, algY, algW, algH, algDestX, currentY + 15, algDestW, algDestH);
            });

            downloadBtn.disabled = false;
        }

        // Native Safari download via Blob URL
        downloadBtn.addEventListener('click', () => {
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'PLL-Sheet.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/png');
        });

        updateSliderLabels();
        drawSheet();
    </script>
</body>
</html>
